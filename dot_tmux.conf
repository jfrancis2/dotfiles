# ~/.tmux.conf: managed by chezmoi. Prefix stays at the default C-b.

# macOS ships an old terminfo without tmux-256color; fall back to screen-256color there.
if-shell "infocmp tmux-256color" "set -g default-terminal tmux-256color" "set -g default-terminal screen-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"
# Long enough for terminal replies to arrive whole over SSH: at 10 ms, tmux 3.4 leaks the reply to
# its colour query (^[]11;rgb:...) into the shell on attach. Still too short to notice in vim.
set -sg escape-time 50
set -g focus-events on
set -g set-clipboard on
set -g mouse on
set -g history-limit 100000

# Number windows and panes from 1, and close gaps when a window exits.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

setw -g mode-keys vi

# New windows and splits open in the current directory.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Flag windows where an unattended agent has printed something.
setw -g monitor-activity on
set -g visual-activity off

set -g status-interval 5
set -g status-left-length 30
set -g status-left "#[bold][#S] "
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[noreverse] ,}#(whoami)@#H %H:%M"
